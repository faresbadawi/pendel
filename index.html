  async function autoName(f, cur) {
    if (!configured()) return;
    try { const st = await resolveStations(cfg); cur.textContent = 'Automatisch: ' + (f.key === 'homeStation' ? st.home.name : st.work.name); } catch {}
  }
  let changed = false;
  const DAYS = [[1, 'Mo'], [2, 'Di'], [3, 'Mi'], [4, 'Do'], [5, 'Fr'], [6, 'Sa'], [0, 'So']];
  function applyTheme() {
    if (cfg.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', cfg.theme);
  }
  const sw = (id, label, icon, on) => `<label class="sw"><span>${ic(icon)} ${label}</span><input type="checkbox" id="${id}" ${on ? 'checked' : ''}></label>`;
  const mSel = (id, val, opts, unit) => `<select id="${id}">${opts.map(m => `<option value="${m}" ${val === m ? 'selected' : ''}>${m} ${unit}</option>`).join('')}</select>`;
  const remSel = (id, val) => `<select id="${id}">${[[0, 'Aus'], [5, '5 Minuten vorher'], [10, '10 Minuten vorher'], [15, '15 Minuten vorher'], [20, '20 Minuten vorher'], [30, '30 Minuten vorher']].map(([m, l]) => `<option value="${m}" ${val === m ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const whoSel = (id, val) => `<select id="${id}">${[['train', 'Zug'], ['car', 'Auto'], ['both', 'Zug und Auto']].map(([v, l]) => `<option value="${v}" ${val === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const renderCompareAndCar = () => { if (last.car) renderCar(last.car); };

  function openSettings(open) {
    let n = 0;
    const grp = (id, icon, title, body) => `<section class="grp ${open === id ? 'open' : ''}" style="--i:${n++}"><button type="button" class="gh" aria-expanded="${open === id}">${ic(icon)}<span>${title}</span></button><div class="gb"><div class="body"><div class="in">${body}</div></div></div></section>`;
    const places = FIELDS.map(f => `
      <div class="field" data-k="${f.key}">
        <span class="label">${ic(f.icon)}${f.title}</span>
        <div class="cur">${esc(curText(f, cfg[f.key]))}</div>
        <div class="pk"></div>
        ${f.kind === 'stop' ? '<button type="button" class="btn auto">Automatisch (nächster Bahnhof)</button>' : ''}
      </div>`).join('') + '<div class="hint">Die Bahn wird von Bahnhof zu Bahnhof gerechnet. Ohne Auswahl nimmt die App den nächsten Bahnhof zur Adresse.</div>';
    const dayOrder = [1, 2, 3, 4, 5, 6, 0];
    const times = `
      <div class="stack" id="defTimes" ${cfg.perDay ? 'hidden' : ''}>
        <div class="field"><span class="label">${ic('flag')}Zur Arbeit: ankommen bis</span><input type="time" id="arriveOut" value="${esc(cfg.arrive.out)}"></div>
        <div class="field"><span class="label">${ic('flag')}Nach Hause: ankommen bis</span><input type="time" id="arriveBack" value="${esc(cfg.arrive.back)}"></div>
      </div>
      ${sw('perDay', 'Für jeden Tag eigene Zeiten', 'clock', cfg.perDay)}
      <div class="stack" id="dayGrid" ${cfg.perDay ? '' : 'hidden'}>
        <div class="drow"><span></span><span class="hint">Zur Arbeit</span><span class="hint">Nach Hause</span></div>
        ${dayOrder.map(n => `<div class="drow"><span>${DAYS.find(x => x[0] === n)[1]}</span>${['out', 'back'].map(w => `<input type="time" data-dw="${n}" data-w="${w}" value="${esc(((cfg.days || {})[n] || {})[w] || '')}">`).join('')}</div>`).join('')}
      </div>
      <div class="hint">Daraus wird die späteste Abfahrt berechnet (Zug und Auto). Leer lassen = kein Ziel an diesem Tag.</div>
      <div class="field"><span class="label">Arbeitstage</span><div class="days" id="days">${DAYS.map(([n, l]) => `<button type="button" data-d="${n}" aria-pressed="${cfg.workdays.includes(n)}">${l}</button>`).join('')}</div></div>
      <div class="field"><span class="label">${ic('bell')}Erinnerung vor dem Losgehen</span>${remSel('remMin', cfg.remind.dep ? cfg.remind.depMin : 0)}</div>
      <div class="field"><span class="label">Erinnerung für</span>${whoSel('remWho', cfg.remind.who)}</div>
      ${sw('notifyDisr', 'Bei neuen Störungen benachrichtigen', 'alert', cfg.notifyDisr)}
      <button type="button" class="btn" id="remTest">${ic('bell')}Erinnerung testen</button>
      <div class="hint">Gilt für Zur Arbeit und Nach Hause, je nach eingetragener Ankunftszeit. Die Erinnerung kommt vor dem Start der Fahrt, nicht erst vor der Ankunft. Sie funktioniert, solange die App geöffnet oder im Hintergrund aktiv ist; eine komplett beendete App kann sich ohne Server nicht selbst melden.</div>`;
    const auto = `
      <div class="field"><span class="label">${ic('euro')}Verbrauch des Autos (Liter pro 100 km)</span><input type="text" inputmode="decimal" id="cons" value="${esc(String(cfg.cons).replace('.', ','))}" placeholder="z. B. 6,5" autocomplete="off">
        <div class="hint">Daraus und aus dem günstigsten Spritpreis in der Nähe berechnet die App die Kosten der Fahrt.</div></div>
      <div class="field"><span class="label">${ic('fuel')}Kraftstoff</span>
        <div class="seg small" id="fuelSeg">${Object.entries(FUELS).map(([v, l]) => `<button data-v="${v}" aria-pressed="${cfg.fuel.type === v}">${l}</button>`).join('')}</div></div>
      <div class="field"><span class="label">Umkreis</span>${mSel('fuelRad', cfg.fuel.rad, [2, 3, 5, 10, 15], 'km')}</div>
      ${sw('fuelGps', 'Um meinen Standort suchen', 'pin', cfg.fuel.gps)}
      <div class="field"><span class="label">Tankerkönig-Schlüssel</span>
        <div class="srow"><input id="tkKey" type="text" value="${esc(cfg.fuel.key)}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="tkSave">Speichern</button></div>
        <div class="hint">Kostenlos unter creativecommons.tankerkoenig.de registrieren. Der Schlüssel bleibt nur in diesem Browser.</div></div>
      <div class="field"><span class="label">${ic('car')}Live-Verkehr (TomTom-Schlüssel)</span>
        <div class="srow"><input id="ttKey" type="text" value="${esc(cfg.tomtom)}" placeholder="API-Key (optional)" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="ttSave">Speichern</button></div>
        <div class="hint">Kostenlos auf developer.tomtom.com, „Routing API“ aktivieren.</div></div>`;
    const look = `
      <div class="seg small" id="themeSeg">${[['auto', 'Automatisch'], ['light', 'Hell'], ['dark', 'Dunkel']].map(([v, l]) => `<button data-v="${v}" aria-pressed="${cfg.theme === v}">${l}</button>`).join('')}</div>
      <button class="btn" id="resetCfg">Alles zurücksetzen</button>`;
    const about = `
      <div class="how">
        <b>Als App installieren</b>
        <ol>
          <li><b>Android (Chrome):</b> Menü ⋮ → „App installieren“ oder „Zum Startbildschirm hinzufügen“.</li>
          <li><b>iPhone / iPad (Safari):</b> Teilen-Symbol → „Zum Home-Bildschirm“.</li>
          <li><b>Computer (Chrome / Edge):</b> Installieren-Symbol rechts in der Adressleiste.</li>
        </ol>
        <div class="hint" style="margin-top:8px">Danach startet Pendel wie eine normale App im Vollbild und zeigt auch ohne Netz die zuletzt geladenen Daten.</div>
      </div>
      <div class="hint">Daten: DB Echtzeit (IRIS) und Transitous für die Bahn, OSRM bzw. TomTom für das Auto, Tankerkönig (MTS-K) für Spritpreise, Open-Meteo für das Wetter.</div>
      <div class="credit">Entwickelt von Fares Badawi 2026<br>mit Hilfe von Claude Code</div>`;
    $('sheet').innerHTML = `<h2>${ic('sliders')}Einstellungen<button type="button" class="circ ok" id="closeDlg" aria-label="Fertig">${ic('check')}</button></h2>
      ${grp('places', 'pin', 'Orte & Bahnhöfe', places)}
      ${grp('times', 'clock', 'Zeiten & Erinnerung', times)}
      ${grp('auto', 'fuel', 'Auto & Sprit', auto)}
      ${grp('look', 'palette', 'Darstellung', look)}
      ${grp('about', 'info', 'Info & Installation', about)}`;
    $('sheet').querySelectorAll('.gh').forEach(h => h.onclick = () => {            // Ziehharmonika: eine Gruppe offen
      const g = h.parentElement, was = g.classList.contains('open');
      $('sheet').querySelectorAll('.grp').forEach(x => { x.classList.remove('open'); x.firstElementChild.setAttribute('aria-expanded', 'false'); });
      if (!was) { g.classList.add('open'); h.setAttribute('aria-expanded', 'true'); setTimeout(() => g.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 360); }
    });

    $('sheet').querySelectorAll('.field[data-k]').forEach(el => {
      const f = FIELDS.find(x => x.key === el.dataset.k);
      const cur = el.querySelector('.cur');
      const set = v => { cfg[f.key] = v; saveCfg(); cur.textContent = curText(f, v); changed = true; if (f.kind === 'stop' && !v) autoName(f, cur); };
      picker(el.querySelector('.pk'), f, set, f.kind === 'addr');
      const auto = el.querySelector('.auto');
      if (auto) auto.onclick = () => set(null);
      if (f.kind === 'stop' && !cfg[f.key]) autoName(f, cur);
    });
    const on = (id, ev, fn) => $(id).addEventListener(ev, fn);
    on('arriveOut', 'change', e => { cfg.arrive.out = e.target.value; saveCfg(); changed = true; });
    on('arriveBack', 'change', e => { cfg.arrive.back = e.target.value; saveCfg(); changed = true; });
    $('days').querySelectorAll('button').forEach(b => b.onclick = () => {
      const d = +b.dataset.d, onn = !cfg.workdays.includes(d);
      cfg.workdays = onn ? [...cfg.workdays, d] : cfg.workdays.filter(x => x !== d);
      b.setAttribute('aria-pressed', onn); saveCfg(); changed = true;
    });
    on('remMin', 'change', e => { const m = +e.target.value; cfg.remind.dep = m > 0; if (m > 0) { cfg.remind.depMin = m; askNotify(); } saveCfg(); changed = true; });
    on('remWho', 'change', e => { cfg.remind.who = e.target.value; saveCfg(); for (const k in remData) delete remData[k]; });
    on('perDay', 'change', e => {
      cfg.perDay = e.target.checked;
      if (cfg.perDay && !Object.keys(cfg.days || {}).length) {                 // beim ersten Einschalten die bisherigen Zeiten übernehmen
        cfg.days = {}; cfg.workdays.forEach(n => { cfg.days[n] = { out: cfg.arrive.out, back: cfg.arrive.back }; });
        $('dayGrid').querySelectorAll('input').forEach(i => { i.value = ((cfg.days[i.dataset.dw] || {})[i.dataset.w]) || ''; });
      }
      $('defTimes').hidden = cfg.perDay; $('dayGrid').hidden = !cfg.perDay;
      saveCfg(); changed = true;
    });
    $('dayGrid').querySelectorAll('input').forEach(i => i.addEventListener('change', () => {
      const n = i.dataset.dw; cfg.days = cfg.days || {}; cfg.days[n] = { ...(cfg.days[n] || {}), [i.dataset.w]: i.value };
      saveCfg(); changed = true;
    }));
    on('notifyDisr', 'change', e => { cfg.notifyDisr = e.target.checked; saveCfg(); if (cfg.notifyDisr) askNotify(); });
    on('remTest', 'click', async () => { await askNotify(); showAlert('Erinnerung', 'So meldet sich Pendel kurz vor dem Losgehen.'); });
    on('cons', 'change', e => { const v = parseFloat(e.target.value.replace(',', '.')); if (v > 0 && v < 40) { cfg.cons = v; saveCfg(); renderCompareAndCar(); } });
    $('fuelSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
      cfg.fuel.type = b.dataset.v; saveCfg(); changed = true;
      $('fuelSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    on('fuelRad', 'change', e => { cfg.fuel.rad = +e.target.value; saveCfg(); changed = true; });
    on('fuelGps', 'change', e => { cfg.fuel.gps = e.target.checked; saveCfg(); changed = true; });
    on('tkSave', 'click', () => { cfg.fuel.key = $('tkKey').value.trim(); saveCfg(); changed = true; $('tkSave').innerHTML = ic('check'); });
    on('ttSave', 'click', () => { cfg.tomtom = $('ttKey').value.trim(); saveCfg(); changed = true; $('ttSave').innerHTML = ic('check'); });
    $('themeSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
      cfg.theme = b.dataset.v; saveCfg(); applyTheme();
      $('themeSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    $('resetCfg').onclick = () => { cfg = defaultCfg(); saveCfg(); applyTheme(); changed = false; $('dlg').close(); openWizard(); };
    $('closeDlg').onclick = () => { $('dlg').close(); applyChanges(); };
    changed = false;
    if (!$('dlg').open) $('dlg').showModal();
  }
  /* ---------- Schnelle Ersteinrichtung ---------- */
  const draft = {};
  let wizStep = 0;
  function openWizard() {
    if ($('dlg').open) $('dlg').close();
    Object.assign(draft, { home: cfg.home, work: cfg.work, homeStation: cfg.homeStation, workStation: cfg.workStation,
      arriveOut: cfg.arrive.out, arriveBack: cfg.arrive.back, remMin: cfg.remind.dep ? cfg.remind.depMin : 0, who: cfg.remind.who, cons: cfg.cons });
    wizStep = 0;
    renderWizard();
    if (!$('wiz').open) $('wiz').showModal();
  }
  async function renderWizard() {
    const el = $('wizSheet');
    const dots = `<div class="dots">${[0, 1, 2, 3].map(i => `<span class="${i <= wizStep ? 'on' : ''}"></span>`).join('')}</div>`;
    if (wizStep === 0 || wizStep === 1) {
      const home = wizStep === 0, key = home ? 'home' : 'work', f = FIELDS[home ? 0 : 2];
      el.innerHTML = `${dots}
        <h2>${ic(home ? 'home' : 'building')}${home ? 'Wo wohnst du?' : 'Wo arbeitest du?'}</h2>
        <div class="hint">${home ? 'Kurz einrichten, das dauert eine halbe Minute. Alles lässt sich später in den Einstellungen ändern.' : 'Adresse oder Name deines Arbeitsorts.'}</div>
        <div class="cur" id="wCur">${draft[key] ? esc(draft[key].label) : ''}</div>
        <div id="wPick"></div>
        <div class="row2">${home ? '' : '<button class="btn" id="wBack">Zurück</button>'}<button class="btn primary" id="wNext" ${draft[key] ? '' : 'disabled'}>Weiter</button></div>`;
      picker($('wPick'), f, v => { draft[key] = v; $('wCur').textContent = v.label; $('wNext').disabled = false; }, home);
      $('wNext').onclick = () => { wizStep++; renderWizard(); };
      if (!home) $('wBack').onclick = () => { wizStep--; renderWizard(); };
      return;
    }
    if (wizStep === 3) {
      el.innerHTML = `${dots}
        <h2>${ic('clock')}Deine Zeiten</h2>
        <div class="hint">Alles optional. Daraus berechnet die App für Zug und Auto, wann du spätestens losmusst, und erinnert dich vorher.</div>
        <div class="field"><span class="label">${ic('flag')}Zur Arbeit: ankommen bis</span><input type="time" id="wArrOut" value="${esc(draft.arriveOut || '')}"></div>
        <div class="field"><span class="label">${ic('flag')}Nach Hause: ankommen bis</span><input type="time" id="wArrBack" value="${esc(draft.arriveBack || '')}"></div>
        <div class="field"><span class="label">${ic('bell')}Erinnerung vor dem Losgehen</span>${remSel('wRem', draft.remMin)}</div>
        <div class="field"><span class="label">Erinnerung für</span>${whoSel('wWho', draft.who)}</div>
        <div class="field"><span class="label">${ic('euro')}Verbrauch (Liter pro 100 km)</span><input type="text" inputmode="decimal" id="wCons" value="${esc(String(draft.cons).replace('.', ','))}" autocomplete="off"></div>
        <div class="row2"><button class="btn" id="wBack">Zurück</button><button class="btn primary" id="wDone">Fertig</button></div>`;
      $('wBack').onclick = () => { wizStep--; renderWizard(); };
      $('wDone').onclick = () => {
        const cons = parseFloat($('wCons').value.replace(',', '.')), m = +$('wRem').value;
        cfg.home = draft.home; cfg.work = draft.work;
        cfg.homeStation = draft.homeStation || null; cfg.workStation = draft.workStation || null;
        cfg.arrive.out = $('wArrOut').value; cfg.arrive.back = $('wArrBack').value;
        cfg.remind.dep = m > 0; cfg.remind.who = $('wWho').value; if (m > 0) { cfg.remind.depMin = m; askNotify(); }
        if (cons > 0 && cons < 40) cfg.cons = cons;
        saveCfg(); $('wiz').close(); reset(); setMode(mode);
      };
      return;
    }
    el.innerHTML = `${dots}
      <h2>${ic('train')}Deine Bahnhöfe</h2>
      <div class="hint">Den nächsten Bahnhof zu beiden Adressen suche ich selbst. Du kannst ihn ändern.</div>
      <div class="field" id="wsHome"><span class="label">${ic('home')}Bei Zuhause</span><div class="cur">Suche …</div><div class="slot"></div></div>
      <div class="field" id="wsWork"><span class="label">${ic('building')}Bei Arbeit</span><div class="cur">Suche …</div><div class="slot"></div></div>
      <div class="row2"><button class="btn" id="wBack">Zurück</button><button class="btn primary" id="wDone">Weiter</button></div>`;
    $('wBack').onclick = () => { wizStep--; renderWizard(); };
    const boxes = { home: $('wsHome'), work: $('wsWork') };
    const defs = [['home', 'homeStation', 1], ['work', 'workStation', 3]];
    const fill = async () => {
      let st = null, err = '';
      try { st = await resolveStations(draft); } catch (e) { err = errText(e); }
      for (const [k, skey] of defs) {
        boxes[k].querySelector('.cur').textContent = st ? st[k].name + (st.auto[k] ? ' (automatisch)' : '') : (draft[skey] ? draft[skey].name : err);
      }
    };
    for (const [k, skey, fi] of defs) {
      const slot = boxes[k].querySelector('.slot');
      slot.innerHTML = '<button type="button" class="linkbtn">Anderen Bahnhof wählen</button><div class="pkw"></div>';
      slot.querySelector('.linkbtn').onclick = () => {
        slot.querySelector('.linkbtn').hidden = true;
        picker(slot.querySelector('.pkw'), FIELDS[fi], v => { draft[skey] = v; fill(); }, false);
      };
    }
    fill();
    $('wDone').onclick = () => { wizStep++; renderWizard(); };
  }
  $('wiz').addEventListener('cancel', e => e.preventDefault());      // Einrichtung nicht per Esc überspringen

  const applyChanges = () => { if (changed) { changed = false; reset(); setMode(mode); } };
  $('dlg').addEventListener('close', applyChanges);
  $('gear').onclick = () => openSettings();                         // alle Gruppen zugeklappt

  /* ---------- Start ---------- */
  applyTheme();
  wideMQ.addEventListener('change', () => { showPanes(); if (carVisible() && configured()) setMode(mode); });
  renderSegs();
  setMode(mode);
  reset();
  renderClock();
  setInterval(() => refresh(), 60000);
  setInterval(() => { renderClock(); checkReminder(); }, 1000);
  addEventListener('online', () => refresh(true));
  addEventListener('offline', () => refresh());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderClock(); refresh(); } });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
